<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*"
    />
    <title>overlay</title>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <textarea id="text-editor" class="text-editor" hidden></textarea>
    <div id="toolbar" class="toolbar" hidden></div>
    <div id="shortcut-panel" class="shortcut-panel" hidden>
      <span class="shortcut-item"><kbd>Enter</kbd>复制</span>
      <span class="shortcut-item"><kbd>Ctrl+S</kbd>保存</span>
      <span class="shortcut-item"><kbd>Ctrl+Z</kbd>撤销</span>
      <span class="shortcut-item"><kbd>Ctrl+Shift+Z</kbd>重做</span>
      <span class="shortcut-item"><kbd>Delete</kbd>删除标注</span>
      <span class="shortcut-item"><kbd>方向键</kbd>微调选区</span>
      <span class="shortcut-item"><kbd>Esc</kbd>取消</span>
    </div>
    <div id="magnifier" class="magnifier" hidden>
      <canvas id="mag-stage"></canvas>
      <div class="magnifier-foot">
        <span id="mag-pos"></span>
        <span id="mag-rgb"></span>
        <div class="magnifier-hints">
          <span>Shift 切换 HEX / RGB</span>
          <span>C 复制颜色值</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/overlay/overlay.ts"></script>
  </body>
</html>
