name: CI

# 日常校验：每次 push / PR 都跑 typecheck、lint、format —— 本地闸门之外
# 的第二道防线。纯静态检查，ubuntu runner 上一两分钟内完成。
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 托管 runner 的 npm 默认执行安装脚本，原生依赖的预编译二进制正常下载
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
