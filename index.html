<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>截图工具</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <span class="logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#19346f" />
                <stop offset="1" stop-color="#4d82f8" />
              </linearGradient>
              <linearGradient id="logo-glint" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#f7ffca" />
                <stop offset="1" stop-color="#a0fff0" />
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="22" height="22" rx="7" fill="url(#logo-bg)" />
            <rect x="5.5" y="5.5" width="13" height="13" rx="3.6" fill="#eef9ff" />
            <rect x="8" y="8" width="8" height="5.6" rx="1.6" fill="#2d5fe6" />
            <circle cx="14" cy="9.8" r="0.9" fill="#fff0b0" />
            <path d="M8 13.6c1.6-1.6 3-2 4.4-.8 1.2 1 2.2.8 3.6-.4v1.2H8Z" fill="#112a6f" />
            <path
              d="M8.2 6.8h-.9a.8.8 0 0 0-.8.8v.9m8.3-1.7h.9a.8.8 0 0 1 .8.8v.9m-9.2 7.8v.9a.8.8 0 0 0 .8.8h.9m8.3-1.7v.9a.8.8 0 0 1-.8.8h-.9"
              fill="none"
              stroke="#3b7cff"
              stroke-linecap="round"
              stroke-width="1.1"
            />
            <circle cx="12" cy="16.2" r="0.9" fill="#2d6cff" />
            <path
              d="M18.2 3.6c.3 1.1.6 1.4 1.7 1.7-1.1.3-1.4.6-1.7 1.7-.3-1.1-.6-1.4-1.7-1.7 1.1-.3 1.4-.6 1.7-1.7Z"
              fill="url(#logo-glint)"
            />
          </svg>
        </span>
        <h1>截图工具</h1>
      </header>

      <button id="start" type="button">开始截图</button>
      <p id="status" class="status" role="status"></p>

      <section class="settings">
        <h2>设置</h2>
        <div class="card">
          <div class="row">
            <span class="label">全局快捷键</span>
            <button id="hotkey" type="button" class="value">Ctrl+Shift+A</button>
          </div>
          <div class="row">
            <span class="label">开机自启</span>
            <input id="autostart" type="checkbox" class="switch" />
          </div>
          <div class="row">
            <span class="label">保存目录</span>
            <button id="savedir" type="button" class="value dir">…</button>
          </div>
          <div class="row">
            <span class="label">默认格式</span>
            <select id="format">
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
            </select>
          </div>
          <div class="row">
            <span class="label">截图历史</span>
            <select id="history-retention" title="历史保留到哪一级；不保留/仅本次运行不会在磁盘留下任何截图">
              <option value="off">不保留</option>
              <option value="session">仅本次运行</option>
              <option value="persistent">持久化到本地</option>
            </select>
          </div>
          <div class="row glass-row" id="glass-strength-row" hidden>
            <label class="label" for="glass-strength">液体玻璃强度</label>
            <div class="glass-control">
              <input
                id="glass-strength"
                class="glass-range"
                type="range"
                min="0"
                max="100"
                step="1"
                value="35"
                title="强度越高，染色越明显，背景透出越少"
              />
              <output id="glass-strength-value" for="glass-strength">35%</output>
            </div>
          </div>
        </div>
      </section>

      <p class="hint">
        快捷键 <kbd id="hotkey-kbd">Ctrl+Shift+A</kbd> 呼出截图，
        <span id="tray-hint">托盘左键</span>开关本面板。选区可跨屏拖动。
      </p>
    </main>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
